apiVersion: v1
kind: Pod
metadata:
  name: http-client
  namespace: rollout-lab
  labels:
    app: rollout-client
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: __APP_IMAGE__
      imagePullPolicy: IfNotPresent
      command: ["python", "-c", "import time; time.sleep(86400)"]
      resources:
        requests:
          cpu: 20m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
  volumes:
    - name: code
      configMap:
        name: rollout-code
